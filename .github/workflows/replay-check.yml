# Diagnostic only (on demand): race replay on the real cloud package – does the map wind follow the race time?
name: Replay provjera
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replay (Jabuka, stvarni paket iz oblaka) – start danas i za 3 dana
        run: |
          npm init -y >/dev/null && npm i playwright-core@1.56.0 2>&1 | tail -1
          export CHROME=$(command -v google-chrome || command -v chromium); echo "browser: $CHROME"
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2
          node tools/diag/replay_check.cjs http://localhost:8080/ 0
          node tools/diag/replay_check.cjs http://localhost:8080/ 3
