# Diagnostic only (on demand): the app on the real cloud package – screenshots (iPhone / iPad / Mac) and checks.
# The screenshots are pushed to the branch diag-shots for review; the app itself is not changed.
name: ClockW provjera
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paket za širi Mediteran + vizualna provjera
        env:
          OPEN_METEO_KEY: ${{ secrets.OPEN_METEO_KEY }}
          ALADIN_USER: ${{ secrets.ALADIN_USER }}
          ALADIN_PASS: ${{ secrets.ALADIN_PASS }}
          CHECK: probe4
        run: |
          npm init -y >/dev/null && npm i playwright-core@1.56.0 2>&1 | tail -1
          export CHROME=$(command -v google-chrome || command -v chromium); echo "browser: $CHROME"
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2
          npm i playwright@1.56.0 2>&1 | tail -1 && npx playwright install --with-deps webkit 2>&1 | tail -2
          if [ "${CHECK:-}" = "probe4" ]; then (python3 -c "import PIL, numpy" 2>/dev/null || pip install --quiet pillow numpy); python3 tools/diag/obs_probe4.py; git fetch -q --depth 1 origin obs && git worktree add -q /tmp/obsrun origin/obs; mkdir -p shots/p4obs && cp /tmp/obsrun/history.json shots/p4obs/ && python3 tools/obs/collect.py shots/p4obs; rm -f shots/p4obs/history.json; elif [ "${CHECK:-}" = "probe3" ]; then python3 tools/diag/obs_probe3.py; elif [ "${CHECK:-}" = "probe2" ]; then node tools/diag/obs_probe2.mjs; elif [ "${CHECK:-}" = "real" ]; then CTW_ONLY=ALADIN,ARPEGE,ECMWF,GFS,ICON-EU node tools/cloud/build_package.mjs data/latest.ctw && cat data/models/index.json && node tools/diag/real_errors.mjs; mkdir -p shots; elif [ "${CHECK:-}" = "obs" ]; then node tools/diag/obs_probe.mjs; elif [ "${CHECK:-}" = "aladin" ]; then CTW_ONLY=ALADIN,ARPEGE,ECMWF node tools/cloud/build_package.mjs data/latest.ctw && ls -la data/models && cat data/models/index.json && node tools/diag/cloud_models_check.cjs http://localhost:8080/; mkdir -p shots; elif [ "${CHECK:-}" = "arpege" ]; then CTW_ONLY=ARPEGE node tools/cloud/build_package.mjs /tmp/arpege.ctw; node tools/diag/arpege_check.mjs /tmp/arpege.ctw; mkdir -p shots; else ENGINE=webkit node tools/diag/render_check.cjs http://localhost:8080/; fi
          mkdir -p shots && ls shots
      - name: Snimke na granu diag-shots
        if: always()
        run: |
          cd shots
          git init -q && git checkout -q -b diag-shots && git add . 
          git -c user.name=ctw-ci -c user.email=ci@users.noreply.github.com commit -qm "snimke $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" diag-shots
