# Diagnostic only (on demand): the app on the real cloud package – screenshots (iPhone / iPad / Mac) and checks.
# The screenshots are pushed to the branch diag-shots for review; the app itself is not changed.
name: ClockW provjera
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vizualna provjera (stvarni paket iz oblaka)
        run: |
          npm init -y >/dev/null && npm i playwright-core@1.56.0 2>&1 | tail -1
          export CHROME=$(command -v google-chrome || command -v chromium); echo "browser: $CHROME"
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2
          node tools/diag/visual_check.cjs http://localhost:8080/
      - name: Snimke na granu diag-shots
        if: always()
        run: |
          cd shots
          git init -q && git checkout -q -b diag-shots && git add . 
          git -c user.name=ctw-ci -c user.email=ci@users.noreply.github.com commit -qm "snimke $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" diag-shots
