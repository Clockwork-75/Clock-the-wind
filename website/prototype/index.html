<title>MS Partners prototip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2F3134; --ink2:#5d5f64; --paper:#F1F0EC; --paper2:#E7E5DF; --dark:#1b1c1e; --dark2:#242528;
  --white:#fbfaf7; --soft:rgba(255,255,255,.72); --line:rgba(255,255,255,.5); --rule:#cfccc4;
  --red:#b3202c; --redlit:#ff5a5a; --green:#1e8e4e; --greenlit:#55d98a;
  --g:max(16px,3.8vw);
  --gl:max(16px,3.8vw,env(safe-area-inset-left,0px)); --gr:max(16px,3.8vw,env(safe-area-inset-right,0px));
  --serif:"Playfair Display",Didot,Georgia,serif; --sans:Jost,system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--dark);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--redlit);outline-offset:3px}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
h1 em,h2 em{font-style:italic}
.eyebrow{font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.mono{font-family:var(--mono);letter-spacing:.1em}

/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:2vw;padding:22px var(--gr) 18px var(--gl);color:var(--white);transition:background .3s,padding .3s}
.hdr::after{content:"";position:absolute;left:var(--gl);right:var(--gr);bottom:0;height:1px;background:var(--line);transition:opacity .6s}
.hdr.solid{background:rgba(24,25,27,.94);padding-top:12px;padding-bottom:12px}
.logo img{height:52px;width:auto;transition:height .3s}
.hdr.solid .logo img{height:40px}
.nav{display:flex;gap:1.9vw;margin-left:auto;align-items:center;transition:opacity .9s}
.nav a{text-decoration:none;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;padding:6px 0;border-bottom:1px solid transparent;white-space:nowrap}
.nav a:hover,.nav a.on{border-bottom-color:var(--white)}
.tools{display:flex;align-items:center;gap:1.2vw;transition:opacity .9s}
.tools button{white-space:nowrap;font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:6px 2px}
.lang b{font-weight:500;border-bottom:1px solid var(--white)} .lang span{opacity:.6}
.cta{border:1px solid var(--white);padding:10px 18px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
.cta:hover{background:var(--white);color:var(--dark)}
.burger{display:none;margin-left:auto;width:44px;height:44px;position:relative}
.burger i{position:absolute;left:10px;right:10px;height:1px;background:var(--white)} .burger i:nth-child(1){top:16px}.burger i:nth-child(2){top:22px}.burger i:nth-child(3){top:28px}
body.intro .nav,body.intro .tools,body.intro .burger{opacity:0;pointer-events:none}
body.intro .hdr::after{opacity:0}
@media (max-width:1180px){
  .burger{display:block}
  .nav{position:fixed;inset:0;background:rgba(24,25,27,.98);flex-direction:column;justify-content:center;gap:22px;margin:0;display:none}
  .nav a{font-size:15px}
  body.menu .nav{display:flex}
  .tools{position:fixed;left:0;right:0;bottom:28px;justify-content:center;gap:22px;display:none;z-index:2}
  body.menu .tools{display:flex}
  .burger{z-index:3}
  .logo{position:relative;z-index:3}
  .logo img{height:42px}
}

/* home */
.home{position:fixed;inset:0;background:var(--dark);color:var(--white);overflow:hidden}
.home-still,.home-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% center}
.home-video{transition:opacity .7s}
.home-video.off{opacity:0;pointer-events:none}
.home .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,22,.42) 0%,rgba(20,20,22,0) 24%),linear-gradient(90deg,rgba(20,20,22,.42) 0%,rgba(20,20,22,0) 48%);transition:opacity 1.2s}
body.intro .home .veil{opacity:0}
.rv{transition:opacity 1.1s ease,transform 1.1s ease}
body.intro .rv{opacity:0;transform:translateY(10px);pointer-events:none}
.home-copy{position:absolute;left:var(--gl);top:clamp(120px,17vh,190px);max-width:min(640px,44vw);transition-delay:.25s}
.home-copy h1{font-size:clamp(36px,4.1vw,76px);margin:2vh 0 2.4vh;text-shadow:0 1px 14px rgba(0,0,0,.25)}
.home-copy p{font-weight:300;font-size:clamp(15px,1.15vw,19px);max-width:30em;opacity:.95}
.facts{position:absolute;left:var(--gl);right:var(--gr);bottom:max(28px,5vh);display:flex;gap:3.2vw;transition-delay:.55s}
.facts div{border-top:1px solid var(--line);padding-top:10px;min-width:118px;max-width:190px}
.facts b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(24px,2.2vw,34px);line-height:1.2}
.facts span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;line-height:1.5;display:block;opacity:.92}
.skip,.replay{position:absolute;right:var(--gr);bottom:max(28px,5vh);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--white);padding:10px 0;border-bottom:1px solid var(--line);opacity:.85}
body:not(.intro) .skip{display:none} body.intro .replay{display:none}
@media (max-width:820px){
  .home-still,.home-video{object-position:70% center}
  .home .veil{background:linear-gradient(180deg,rgba(20,20,22,.6) 0%,rgba(20,20,22,.25) 45%,rgba(20,20,22,.75) 100%)}
  .home-copy{max-width:none;right:var(--gr);top:104px}
  .home-copy p{font-size:15px}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;bottom:64px}
  .facts div{max-width:none} .facts span{font-size:10px}
  .replay,.skip{bottom:14px}
}
@media (max-height:620px){.home-copy p{display:none}}

/* inner pages */
.page{background:var(--paper);min-height:100vh}
.phero{position:relative;height:clamp(380px,74vh,820px);background:var(--dark);color:var(--white);overflow:hidden}
.phero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,22,.55) 0%,rgba(20,20,22,0) 26%,rgba(20,20,22,0) 45%,rgba(20,20,22,.78) 100%)}
.phero-in{position:absolute;left:var(--gl);right:var(--gr);bottom:clamp(28px,6vh,64px);z-index:2;max-width:980px}
.phero h1{font-size:clamp(34px,4.4vw,72px);margin-top:14px;text-shadow:0 1px 16px rgba(0,0,0,.4)}
.phero p{margin-top:14px;max-width:38em;font-weight:300;font-size:clamp(16px,1.2vw,19px)}
.dhead{background:var(--dark);color:var(--white);padding:clamp(130px,20vh,200px) var(--gr) clamp(40px,7vh,80px) var(--gl)}
.dhead h1{font-size:clamp(34px,4.4vw,72px);margin-top:14px;max-width:16em}
.dhead p{margin-top:16px;max-width:38em;font-weight:300;color:var(--soft)}
.sec{padding:clamp(52px,8vw,112px) var(--gr) clamp(52px,8vw,112px) var(--gl)}
.sec.dark{background:var(--dark);color:var(--white)} .sec.alt{background:var(--paper2)}
.wrap{max-width:1200px;margin:0 auto}
.sec h2{font-size:clamp(28px,3vw,46px);margin-bottom:14px}
.sub{color:var(--ink2);max-width:40em;margin-bottom:clamp(28px,4vw,52px)} .dark .sub{color:var(--soft)}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(28px,5vw,80px);align-items:start}
.prose p{max-width:38em;margin-bottom:1.1em}
.prose p:first-child{font-size:1.14em}
.quote{font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.2vw,32px);line-height:1.3;border-left:2px solid var(--red);padding-left:clamp(18px,2vw,30px)}
.rank{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);margin-top:28px}
.rank div{padding:22px 22px 6px 0;border-right:1px solid rgba(255,255,255,.2);padding-left:22px} .rank div:first-child{padding-left:0} .rank div:last-child{border-right:0}
.rank b{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3vw,44px);display:block}
.rank span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.card{background:var(--paper);padding:clamp(22px,2.4vw,34px)}
.card .n{font-family:var(--mono);font-size:12px;color:var(--red);letter-spacing:.14em}
.card h3{font-size:24px;margin:10px 0 12px}
.card p{font-size:16px;color:var(--ink)}
.card .proof{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);font-size:14.5px;color:var(--ink2)}
.band{position:relative;height:clamp(260px,52vw,640px);overflow:hidden;background:var(--dark)}
.band img{width:100%;height:100%;object-fit:cover}
.list4{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,3vw,44px) clamp(28px,5vw,80px)}
.list4 h3{font-size:22px;margin-bottom:8px;padding-top:16px;border-top:1px solid var(--line)}
.list4 p{color:var(--soft);font-weight:300}
.dl{border-top:1px solid var(--rule)}
.dl div{display:grid;grid-template-columns:minmax(150px,1fr) 2.4fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--rule)}
.dl b{font-weight:500} .dl span{color:var(--ink2)}
.figimg{width:100%;aspect-ratio:4/3;object-fit:cover}
.more{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px}
.btn{display:inline-block;border:1px solid currentColor;padding:12px 20px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)} .dark .btn:hover{background:var(--white);color:var(--dark);border-color:var(--white)}

/* practice grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:clamp(18px,2vw,30px)}
.pcard{text-decoration:none;display:block;background:var(--dark2);color:var(--white);position:relative;overflow:hidden}
.pcard img{width:100%;aspect-ratio:16/10;object-fit:cover;transition:transform .8s ease,opacity .4s;opacity:.92}
.pcard:hover img{transform:scale(1.04);opacity:1}
.pcard div{padding:18px 20px 22px}
.pcard small{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
.pcard h3{font-size:23px;margin-top:8px;line-height:1.18}
.caps{list-style:none;counter-reset:c;border-top:1px solid var(--rule)}
.caps li{counter-increment:c;display:grid;grid-template-columns:44px 1fr;padding:15px 0;border-bottom:1px solid var(--rule)}
.caps li::before{content:counter(c,decimal-leading-zero);font-family:var(--mono);font-size:12px;color:var(--red);padding-top:5px}
.aside{position:sticky;top:96px}
.aside h4,.h4{font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:14px;color:var(--ink2)}
.matters{list-style:none;margin-bottom:38px}
.matters li{padding:13px 0 13px 18px;border-bottom:1px solid var(--rule);position:relative;font-size:16px}
.matters li::before{content:"";position:absolute;left:0;top:23px;width:7px;height:7px;background:var(--red)}
.chips{display:flex;flex-direction:column;gap:10px}
.chip{display:flex;align-items:center;gap:14px;text-decoration:none}
.chip img{width:54px;height:66px;object-fit:cover;object-position:center top}
.chip b{font-weight:500;display:block;line-height:1.3} .chip span{font-size:14px;color:var(--ink2)}
.chip:hover b{text-decoration:underline}
.fig{display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(24px,4vw,64px);align-items:center}
.fig img{width:100%;aspect-ratio:16/9;object-fit:cover}
.fig p{font-family:var(--serif);font-size:clamp(20px,1.9vw,28px);line-height:1.3}
.taxbox{border-left:2px solid var(--red);padding:6px 0 6px clamp(18px,2vw,30px);max-width:46em;margin-top:44px}
.pn{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:24px}
.pn a{text-decoration:none;max-width:46%} .pn small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:6px}
.pn span{font-family:var(--serif);font-size:clamp(18px,1.8vw,26px)} .pn a:hover span{text-decoration:underline} .pn a:last-child{text-align:right;margin-left:auto}

/* team */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:clamp(20px,2.4vw,36px)}
.tcard{text-decoration:none;display:block}
.tcard .ph{overflow:hidden;background:var(--dark2)}
.tcard img{width:100%;aspect-ratio:4/5;object-fit:cover;transition:transform .8s ease}
.tcard:hover img{transform:scale(1.03)}
.tcard h3{font-size:23px;margin-top:14px}
.tcard span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.person{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:clamp(28px,5vw,80px);align-items:start}
.person img{width:100%;aspect-ratio:4/5;object-fit:cover}
.person h1{font-size:clamp(34px,4vw,60px)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:8px 22px;margin:22px 0 28px;padding:18px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:15.5px}
.meta dt{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);padding-top:4px}
.meta a{text-decoration-color:var(--rule);text-underline-offset:3px}
.backl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;display:inline-block;margin-bottom:22px;color:var(--ink2)} .backl:hover{color:var(--ink)}

/* references */
.refhero{background:var(--dark);color:var(--white);position:relative}
.bw{position:relative;overflow:hidden}
.bi{position:relative;aspect-ratio:2200/1237}
.bi>img{width:100%;height:100%;object-fit:cover}
.hot{position:absolute;left:45.4%;width:36.5%;height:2.9%;border:1px solid transparent;transition:background .15s,border-color .15s}
.hot:hover,.hot:focus-visible{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.6)}
.hot.on{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.85)}
.rtitle{position:absolute;left:var(--gl);top:19%;max-width:32vw;z-index:2;padding:20px 24px 22px;margin-left:-24px;background:linear-gradient(90deg,rgba(18,18,20,.8),rgba(18,18,20,.55) 70%,rgba(18,18,20,0));text-shadow:0 1px 10px rgba(0,0,0,.6)}
.rtitle h1{font-size:clamp(34px,3.7vw,66px);margin:12px 0}
.rtitle p{font-weight:300;max-width:24em}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:16px;font-family:var(--mono);font-size:12.5px;letter-spacing:.1em}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;vertical-align:middle}
.legend .l::before{background:var(--greenlit)} .legend .o::before{background:var(--redlit)}
.rcard{position:absolute;right:var(--gr);bottom:5%;width:min(470px,34vw);background:rgba(241,240,236,.97);color:var(--ink);padding:20px 22px;display:flex;gap:16px;z-index:3;text-shadow:none}
.rcard img{width:38%;aspect-ratio:4/3;object-fit:cover;align-self:flex-start}
.rcard h3{font-family:var(--mono);font-size:13px;letter-spacing:.1em;line-height:1.4;text-transform:uppercase}
.st{font-family:var(--mono);font-size:12px;letter-spacing:.12em;font-weight:500} .st.l{color:var(--green)} .st.o{color:var(--red)}
.rcard p{font-size:14.5px;line-height:1.5;margin-top:8px}
.rcard small,.mcard small{display:block;margin-top:10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.filters .lab{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);min-width:64px}
.fb{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);padding:5px 14px 5px 5px;font-size:13.5px;min-height:40px}
.fb.t{padding-left:14px}
.fb img{width:40px;height:30px;object-fit:cover}
.fb[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:28px}
.mcard{background:var(--paper);padding:20px;display:grid;grid-template-columns:96px 1fr;gap:16px;scroll-margin-top:100px}
.mcard.hl{background:#fff}
.mcard img{width:96px;height:72px;object-fit:cover}
.mcard h3{font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;line-height:1.4}
.mcard p{font-size:15px;line-height:1.5;margin-top:6px}
@media (max-width:900px){
  .rtitle{position:static;max-width:none;margin:0;padding:104px var(--gr) 26px var(--gl);background:none}
  .bw{aspect-ratio:100/66}
  .bi{width:250%;margin-left:-109%;margin-top:-17.5%}
  .rcard{position:static;width:auto;margin:0}
}

/* testimonials, insights, contact */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,4vw,64px) clamp(28px,5vw,80px)}
.q blockquote{font-family:var(--serif);font-size:clamp(20px,1.8vw,27px);line-height:1.36;border-top:1px solid var(--rule);padding-top:22px}
.q blockquote::before{content:"„";color:var(--red)} .q blockquote::after{content:"“"}
.en .q blockquote::before{content:"“"} .en .q blockquote::after{content:"”"}
.q cite{display:block;margin-top:14px;font-style:normal;font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--ink2)}
.note{font-size:14px;color:var(--ink2);margin-top:40px}
.radar{width:100%;border-collapse:collapse}
.radar th{font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:0 18px 12px 0;border-bottom:1px solid var(--ink)}
.radar td{padding:18px 18px 18px 0;border-bottom:1px solid var(--rule);vertical-align:top;font-size:16px}
.radar td:first-child{font-family:var(--serif);font-size:22px;white-space:nowrap}
.radar td:nth-child(3){font-family:var(--mono);font-size:13px;letter-spacing:.06em;white-space:nowrap}
.radar a{text-underline-offset:3px;text-decoration-color:var(--rule);white-space:nowrap}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,80px)}
.cblock{border-top:1px solid var(--rule);padding:18px 0 26px}
.cblock .h4{margin-bottom:8px}
.big{font-family:var(--serif);font-size:clamp(22px,2.2vw,32px);line-height:1.25}
.copyrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cp{font-size:11px;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--rule);padding:8px 12px;min-height:36px}
.cp:hover{border-color:var(--ink)}

/* footer */
.ft{background:var(--dark);color:var(--soft);padding:56px var(--gr) 34px var(--gl);font-size:14.5px}
.ft .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:36px}
.ft img{height:46px;margin-bottom:18px}
.ft h4{font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--white);margin-bottom:12px}
.ft a{display:block;text-decoration:none;padding:3px 0} .ft a:hover{color:var(--white)}
.ft .legal{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.18);padding-top:18px;font-size:12.5px}

/* search */
.srch{position:fixed;inset:0;z-index:80;background:rgba(24,25,27,.97);color:var(--white);padding:clamp(80px,14vh,140px) var(--gr) 40px var(--gl);display:none;overflow:auto}
.srch.open{display:block}
.srch input{width:100%;max-width:900px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--white);font-family:var(--serif);font-size:clamp(24px,3vw,40px);padding:10px 0;outline:none}
.srch input::placeholder{color:rgba(255,255,255,.45)}
.srch .x{position:absolute;top:26px;right:var(--gr);font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:10px 0}
.res{max-width:900px;margin-top:22px}
.res a{display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.16);text-decoration:none}
.res a:hover b{text-decoration:underline}
.res small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);min-width:120px}
.res b{font-weight:400;font-size:18px}

@media (max-width:900px){
  body{font-size:16px}
  .two,.fig,.person,.cgrid,.qgrid,.list4{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .rank{grid-template-columns:1fr} .rank div{border-right:0;padding-left:0;border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:16px}
  .aside{position:static}
  .dl div{grid-template-columns:1fr;gap:4px}
  .ft .wrap{grid-template-columns:1fr}
  .radar thead{display:none} .radar,.radar tbody,.radar tr,.radar td{display:block}
  .radar tr{border-bottom:1px solid var(--rule);padding:16px 0} .radar td{border:0;padding:3px 0}
  .person img{max-width:420px}
}
@media (min-width:901px) and (max-width:1100px){.cards{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="hdr" id="hdr"></header>
<main id="app"></main>
<div class="srch" id="srch" role="dialog" aria-modal="true"></div>

<script src="content.js"></script>
<script>
(function(){
const D=window.MS; let lang='hr';
try{const s=localStorage.getItem('ms_lang'); if(s==='en'||s==='hr') lang=s}catch(e){}
let introDone=false; try{introDone=sessionStorage.getItem('ms_intro')==='1'}catch(e){}
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const T=()=>D.ui[lang], L=o=>o[lang];
const im=(k,t)=>'img/'+k+(t?'_t':'')+'.jpg';
const P=id=>D.practices.find(p=>p.id===id), H=id=>D.people.find(p=>p.id===id);
const app=$('#app'), hdr=$('#hdr'), body=document.body;
const NAV=['drustvo','prakse','tim','reference','izjave','uvidi','kontakt'];
const cur=()=>(location.hash||'').replace(/^#/,'')||'home';
const sect=h=>h.startsWith('praksa-')?'prakse':h.startsWith('tim-')?'tim':h;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');

function header(){
  const t=T(), h=sect(cur());
  hdr.innerHTML=`<a class="logo" href="#home" aria-label="MS Partners"><img src="img/logo_white.png" alt="M&S — Šooš Maceljski, Mandić, Stanić & Partners"></a>
  <button class="burger" id="burger" aria-label="Menu"><i></i><i></i><i></i></button>
  <nav class="nav" aria-label="Main">${NAV.map(k=>`<a href="#${k}" class="${h===k?'on':''}">${t.nav[k]}</a>`).join('')}</nav>
  <div class="tools"><button id="sbtn">${t.search}</button>
  <button class="lang" id="lbtn" aria-label="Language">${lang==='hr'?'<b>HR</b> <span>/ EN</span>':'<span>HR /</span> <b>EN</b>'}</button>
  <a class="cta" href="#kontakt">${t.cta}</a></div>`;
  $('#burger').onclick=()=>body.classList.toggle('menu');
  $('#lbtn').onclick=()=>{lang=lang==='hr'?'en':'hr';try{localStorage.setItem('ms_lang',lang)}catch(e){};render(true)};
  $('#sbtn').onclick=openSearch;
}
function footer(){
  const t=T(), c=L(D.contact);
  return `<footer class="ft"><div class="wrap">
   <div><img src="img/logo_white.png" alt="M&S"><p>${c.firm}</p></div>
   <div><h4>${c.hq}</h4><p>Trg žrtava fašizma 6<br>10000 Zagreb</p><p style="margin-top:10px">${c.offices}: Knin · Šibenik</p><p style="margin-top:10px">+385 1 3707 030<br>info@mspartners.hr</p></div>
   <div><h4>MS Partners</h4>${NAV.map(k=>`<a href="#${k}">${t.nav[k]}</a>`).join('')}</div>
   <div class="legal">© 2026 MS Partners</div></div></footer>`;
}
const phero=(img,e,h,p,alt)=>`<section class="phero"><img src="${im(img)}" alt="${alt||''}"><div class="phero-in"><div class="eyebrow">${e}</div><h1>${h}</h1>${p?`<p>${p}</p>`:''}</div></section>`;
const dhead=(e,h,p)=>`<section class="dhead"><div class="wrap"><div class="eyebrow">${e}</div><h1>${h}</h1>${p?`<p>${p}</p>`:''}</div></section>`;
const chip=id=>{const p=H(id);return `<a class="chip" href="#tim-${p.id}"><img src="img/${p.img}.jpg" alt="" loading="lazy"><div><b>${p.name}</b><span>${L(p).role}</span></div></a>`};

/* ---------- pages ---------- */
function home(){
  const c=L(D.home), t=T(), play=!introDone&&!reduce;
  body.classList.toggle('intro',play);
  app.innerHTML=`<section class="home">
   <img class="home-still" src="img/hero.jpg" alt="${lang==='hr'?'Predvorje iz 1960-ih: odvjetnik s aktovkom i žena u crvenoj haljini':'A 1960s lobby: a lawyer with a briefcase and a woman in a red dress'}">
   <video class="home-video${play?'':' off'}" muted playsinline preload="auto" poster="img/hero_t.jpg" ${play?'src="img/intro.mp4"':''}></video>
   <div class="veil"></div>
   <div class="home-copy rv"><div class="eyebrow">${c.eyebrow}</div><h1>${c.h1a}<br><em>${c.h1b}</em></h1><p>${c.lead}</p></div>
   <div class="facts rv">${c.facts.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div>
   <button class="skip" id="skip">${t.skip}</button><button class="replay rv" id="replay">${t.replay}</button>
  </section>`;
  const v=$('.home-video');
  const finish=()=>{ if(introDone&&!body.classList.contains('intro'))return; introDone=true; try{sessionStorage.setItem('ms_intro','1')}catch(e){}
    v.classList.add('off'); body.classList.remove('intro'); try{v.pause()}catch(e){} };
  $('#skip').onclick=finish;
  $('#replay').onclick=()=>{introDone=false; home()};
  if(play){
    v.addEventListener('ended',finish); v.addEventListener('error',finish);
    v.removeAttribute('poster');
    const pr=v.play(); if(pr&&pr.catch) pr.catch(finish);
    setTimeout(()=>{ if(v.currentTime===0) finish() },4500);
    const any=e=>{ if(e.type==='keydown'&&e.key==='Tab')return; finish(); off() };
    const off=()=>['wheel','keydown','touchstart'].forEach(k=>window.removeEventListener(k,any));
    ['wheel','keydown','touchstart'].forEach(k=>window.addEventListener(k,any,{passive:true}));
  }
}
function firm(){
  const c=L(D.firm), t=T();
  return phero('vrata',c.eyebrow,c.h1,'',lang==='hr'?'Ulazna vrata društva':'The firm’s entrance')+
  `<section class="sec"><div class="wrap two"><div class="prose">${c.intro.map(p=>`<p>${p}</p>`).join('')}</div><p class="quote">${c.quote}</p></div></section>
  <section class="sec dark"><div class="wrap"><div class="eyebrow">${c.rank.h}</div><div class="rank">${c.rank.items.map(r=>`<div><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}</div></div></section>
  <div class="band"><img src="${im('boardroom')}" alt="" loading="lazy"></div>
  <section class="sec"><div class="wrap"><h2>${c.whyH}</h2><p class="sub">${c.whyLead}</p>
   <div class="cards">${c.why.map((w,i)=>`<article class="card"><div class="n">0${i+1}</div><h3>${w[0]}</h3><p>${w[1]}</p><p class="proof">${w[2]}</p></article>`).join('')}</div></div></section>
  <section class="sec dark"><div class="wrap"><h2>${c.howH}</h2><div class="list4" style="margin-top:30px">${c.how.map(w=>`<div><h3>${w[0]}</h3><p>${w[1]}</p></div>`).join('')}</div></div></section>
  <div class="band"><img src="${im('knjiznica')}" alt="" loading="lazy"></div>
  <section class="sec"><div class="wrap two"><div><h2>${c.feeH}</h2><p class="sub">${c.feeLead}</p></div><div class="dl">${c.fee.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div></div></section>
  <section class="sec alt"><div class="wrap two"><div><h2>${c.intlH}</h2><p style="max-width:36em">${c.intl}</p></div><img class="figimg" src="${im('medjunarodno')}" alt="" loading="lazy"></div></section>
  <section class="sec"><div class="wrap"><h2>${c.recH}</h2><div class="dl" style="margin-top:26px">${c.rec.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div>
   <div class="more"><a class="btn" href="#prakse">${t.seePrac}</a><a class="btn" href="#tim">${t.seeTeam}</a><a class="btn" href="#reference">${t.seeRef}</a></div></div></section>`;
}
function practices(){
  const h=L(D.pageHeads.prakse);
  return dhead(h[0],h[1],h[2])+`<section class="sec dark" style="padding-top:0"><div class="wrap pgrid">${D.practices.map(p=>`<a class="pcard" href="#praksa-${p.id}"><img src="${im(p.img,1)}" alt="" loading="lazy"><div><small>${L(p).tag}</small><h3>${L(p).name}</h3></div></a>`).join('')}</div></section>`;
}
function practice(id){
  const p=P(id); if(!p) return practices(); const c=L(p), t=T(), i=D.practices.indexOf(p), n=D.practices.length;
  const pv=D.practices[(i+n-1)%n], nx=D.practices[(i+1)%n];
  return phero(p.img,c.tag,c.name)+
  `<section class="sec"><div class="wrap two"><div><a class="backl" href="#prakse">← ${t.back}</a><div class="prose"><p>${c.lead}</p></div>
    <h4 class="h4" style="margin-top:34px">${t.caps}</h4><ol class="caps">${c.caps.map(x=>`<li><span>${x}</span></li>`).join('')}</ol>
    ${p.tax?`<div class="taxbox"><h4 class="h4">${t.tax}</h4><p>${c.tax}</p></div>`:''}</div>
   <aside class="aside"><h4>${t.matters}</h4><ul class="matters">${c.matters.map(x=>`<li>${x}</li>`).join('')}</ul>
    <h4>${t.team}</h4><div class="chips">${p.team.map(chip).join('')}</div>
    <div class="more"><a class="btn" href="#reference">${t.seeRef}</a></div></aside></div></section>
  ${p.img2?`<section class="sec alt"><div class="wrap fig"><img src="${im(p.img2)}" alt="" loading="lazy"><p>${c.cap2}</p></div></section>`:''}
  <section class="sec dark"><div class="wrap pn"><a href="#praksa-${pv.id}"><small>←</small><span>${L(pv).name}</span></a><a href="#praksa-${nx.id}"><small>→</small><span>${L(nx).name}</span></a></div></section>`;
}
function team(){
  const h=L(D.pageHeads.tim);
  return dhead(h[0],h[1],h[2])+`<section class="sec"><div class="wrap tgrid">${D.people.map(p=>`<a class="tcard" href="#tim-${p.id}"><div class="ph"><img src="img/${p.img}.jpg" alt="${p.name}" loading="lazy"></div><h3>${p.name}</h3><span>${L(p).role} · ${p.office}</span></a>`).join('')}</div></section>`;
}
function person(id){
  const p=H(id); if(!p) return team(); const c=L(p), t=T();
  return `<div style="background:var(--dark);height:96px"></div><section class="sec" style="padding-top:clamp(40px,6vw,72px)"><div class="wrap person"><img src="img/${p.img}.jpg" alt="${p.name}">
   <div><a class="backl" href="#tim">← ${t.nav.tim}</a><div class="eyebrow" style="color:var(--red)">${c.role}</div><h1 style="margin-top:10px">${p.name}</h1>
   <dl class="meta"><dt>${t.office}</dt><dd>${p.office}</dd><dt>${t.languages}</dt><dd>${c.lang}</dd><dt>${t.practices}</dt><dd>${p.pr.map(x=>`<a href="#praksa-${x}">${L(P(x)).name}</a>`).join('<br>')}</dd></dl>
   <div class="prose">${c.bio.map(b=>`<p>${b}</p>`).join('')}</div></div></div></section>`;
}
let rf={s:'all',st:'all',sel:0};
function refCard(r){
  const t=T(), s=D.sectors[r.s];
  return `<img src="${im(s.img,1)}" alt=""><div><h3>${r.code} · ${L(r)[0]}</h3><div class="st ${r.st?'l':'o'}">${r.st?'LANDED':'ONGOING'}</div><p>${L(r)[1]}</p><small>${L(s)}</small></div>`;
}
function refs(){
  const h=L(D.pageHeads.reference), t=T();
  const hots=D.refs.filter(r=>r.board!=null).map(r=>`<button class="hot${rf.sel===r.board?' on':''}" data-b="${r.board}" style="top:${((232.1+31.3*r.board)/1080*100-1.45).toFixed(2)}%" aria-label="${r.code} ${L(r)[0]}"></button>`).join('');
  return `<section class="refhero"><div class="rtitle"><div class="eyebrow">${h[0]}</div><h1>${h[1]}</h1><p>${h[2]}</p>
    <div class="legend"><span class="l">${t.landed}</span><span class="o">${t.ongoing}</span></div></div>
   <div class="bw"><div class="bi"><img src="${im('ref')}" alt="${lang==='hr'?'Aerodromska ploča s popisom mandata':'Airport board listing the matters'}">${hots}</div></div>
   <div class="rcard" id="rcard" aria-live="polite">${refCard(D.refs[rf.sel])}</div></section>
  <section class="sec"><div class="wrap">
   <div class="filters" id="fs"><span class="lab">${t.sector}</span><button class="fb t" data-s="all">${t.all}</button>${Object.keys(D.sectors).map(k=>`<button class="fb" data-s="${k}"><img src="${im(D.sectors[k].img,1)}" alt="">${L(D.sectors[k])}</button>`).join('')}</div>
   <div class="filters" id="fst"><span class="lab">${t.status}</span><button class="fb t" data-st="all">${t.all}</button><button class="fb t" data-st="1">${t.landed}</button><button class="fb t" data-st="0">${t.ongoing}</button></div>
   <div class="mgrid" id="mgrid"></div></div></section>`;
}
function refsBind(){
  const grid=$('#mgrid'), t=T();
  const draw=()=>{
    const list=D.refs.filter(r=>(rf.s==='all'||r.s===rf.s)&&(rf.st==='all'||String(r.st)===rf.st));
    grid.innerHTML=list.length?list.map(r=>`<article class="mcard" id="m${D.refs.indexOf(r)}"><img src="${im(D.sectors[r.s].img,1)}" alt="" loading="lazy"><div><h3>${r.code} · ${L(r)[0]}</h3><div class="st ${r.st?'l':'o'}">${r.st?'LANDED':'ONGOING'}</div><p>${L(r)[1]}</p><small>${L(D.sectors[r.s])}</small></div></article>`).join(''):`<p style="background:var(--paper);padding:24px">${t.noResults}</p>`;
    $$('#fs .fb').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===rf.s));
    $$('#fst .fb').forEach(b=>b.setAttribute('aria-pressed',b.dataset.st===rf.st));
  };
  $$('#fs .fb').forEach(b=>b.onclick=()=>{rf.s=b.dataset.s;draw()});
  $$('#fst .fb').forEach(b=>b.onclick=()=>{rf.st=b.dataset.st;draw()});
  $$('.hot').forEach(b=>b.onclick=()=>{rf.sel=+b.dataset.b;$$('.hot').forEach(x=>x.classList.toggle('on',x===b));$('#rcard').innerHTML=refCard(D.refs.find(r=>r.board===rf.sel))});
  draw();
}
function testimonials(){
  const c=L(D.testimonials);
  return phero('testi',c.eyebrow,c.h1,'',lang==='hr'?'Televizijski studio iz 1960-ih':'A 1960s television studio')+`<section class="sec"><div class="wrap"><div class="qgrid">${c.q.map(q=>`<figure class="q"><blockquote>${q[0]}</blockquote><cite>${q[1]}</cite></figure>`).join('')}</div><p class="note">${c.note}</p></div></section>`;
}
function insights(){
  const c=L(D.insights);
  return phero('uvidi',c.eyebrow,c.h1,c.lead,lang==='hr'?'Radarska soba':'A radar room')+`<section class="sec"><div class="wrap"><table class="radar"><thead><tr><th>${c.colA}</th><th>${c.colB}</th><th>${c.colC}</th><th>${c.colD}</th></tr></thead><tbody>${c.items.map(i=>`<tr><td>${i[0]}</td><td>${i[1]}</td><td>${i[2]}</td><td><a href="#tim-${i[3]}">${H(i[3]).name}</a></td></tr>`).join('')}</tbody></table></div></section>`;
}
function contact(){
  const c=L(D.contact), t=T();
  const row=v=>`<div class="copyrow"><span class="big">${v}</span><button class="cp" data-c="${v}">${t.copy}</button></div>`;
  return phero('kontakt',c.eyebrow,c.h1,c.lead,lang==='hr'?'Trg žrtava fašizma u Zagrebu':'Trg žrtava fašizma, Zagreb')+`<section class="sec"><div class="wrap cgrid">
   <div><div class="cblock"><h4 class="h4">${c.tel}</h4>${row('+385 1 3707 030')}</div><div class="cblock"><h4 class="h4">${c.mail}</h4>${row('info@mspartners.hr')}</div></div>
   <div><div class="cblock"><h4 class="h4">${c.hq}</h4><p class="big">Trg žrtava fašizma 6<br>10000 Zagreb</p></div><div class="cblock"><h4 class="h4">${c.offices}</h4><p class="big">Knin · Šibenik</p></div><p class="note" style="margin-top:0">${c.firm}</p></div></div></section>`;
}

/* ---------- search ---------- */
function openSearch(){
  const t=T(), el=$('#srch'); body.classList.remove('menu');
  const idx=[].concat(
    D.practices.map(p=>({k:t.nav.prakse,n:L(p).name,x:L(p).name+' '+L(p).caps.join(' '),h:'#praksa-'+p.id})),
    D.people.map(p=>({k:t.nav.tim,n:p.name,x:p.name+' '+L(p).role,h:'#tim-'+p.id})),
    D.refs.map((r,i)=>({k:t.nav.reference,n:r.code+' · '+L(r)[0],x:r.code+' '+L(r).join(' '),h:'#reference',i})));
  el.innerHTML=`<button class="x" id="sx">${t.close} ✕</button><input id="sq" type="search" placeholder="${t.searchPh}" aria-label="${t.search}" autocomplete="off"><div class="res" id="sr"></div>`;
  el.classList.add('open');
  const q=$('#sq'), r=$('#sr'), close=()=>el.classList.remove('open');
  const draw=()=>{const v=norm(q.value.trim()); const m=v.length<2?[]:idx.filter(o=>norm(o.x).includes(v)).slice(0,14);
    r.innerHTML=v.length<2?'':(m.length?m.map(o=>`<a href="${o.h}" ${o.i!=null?`data-i="${o.i}"`:''}><small>${o.k}</small><b>${o.n}</b></a>`).join(''):`<p style="padding:14px 0;color:var(--soft)">${t.noResults}</p>`);
    $$('a',r).forEach(a=>a.onclick=()=>{close(); if(a.dataset.i!=null){const i=a.dataset.i; setTimeout(()=>{const m=$('#m'+i); if(m){m.classList.add('hl');m.scrollIntoView({block:'center'})}},120)}})};
  q.oninput=draw; $('#sx').onclick=close; q.onkeydown=e=>{if(e.key==='Escape')close()}; q.focus();
}

/* ---------- router ---------- */
function render(keep){
  const h=cur(); body.classList.remove('menu'); body.classList.toggle('en',lang==='en');
  document.documentElement.lang=lang; header();
  if(h==='home'){ body.style.overflow='hidden'; home(); onScroll(); return }
  body.classList.remove('intro'); body.style.overflow='';
  let html;
  if(h==='drustvo') html=firm(); else if(h==='prakse') html=practices(); else if(h.startsWith('praksa-')) html=practice(h.slice(7));
  else if(h==='tim') html=team(); else if(h.startsWith('tim-')) html=person(h.slice(4)); else if(h==='reference') html=refs();
  else if(h==='izjave') html=testimonials(); else if(h==='uvidi') html=insights(); else if(h==='kontakt') html=contact();
  else { location.hash='#home'; return }
  app.innerHTML=`<div class="page">${html}</div>`+footer();
  if(h==='reference') refsBind();
  $$('.cp').forEach(b=>b.onclick=()=>{const v=b.dataset.c, ok=()=>{b.textContent=T().copied;setTimeout(()=>b.textContent=T().copy,1600)};
    try{navigator.clipboard.writeText(v).then(ok,ok)}catch(e){ok()}});
  if(!keep) window.scrollTo(0,0); onScroll();
}
function onScroll(){ hdr.classList.toggle('solid',cur()!=='home'&&window.scrollY>40) }
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('hashchange',()=>render());
window.addEventListener('keydown',e=>{if(e.key==='Escape'){body.classList.remove('menu');$('#srch').classList.remove('open')}});
render();
})();
</script>
